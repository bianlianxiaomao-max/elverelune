<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELVERE &amp; LUNE — Natural Crystal Bracelets</title>

  <!-- Fonts（本地化，不再依赖 Google Fonts） -->
  <link rel="stylesheet" href="fonts.css">

  <link rel="stylesheet" href="style.css">

  <!-- Three.js importmap（本地化，不再依赖 unpkg） -->
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three/build/three.module.js",
      "three/addons/": "./libs/three/examples/jsm/"
    }
  }
  </script>

  <!-- noscript fallback -->
  <noscript>
    <style>
      .hero-3d__label,
      .hero-3d__title,
      .hero-3d__subtitle,
      .hero-3d__scroll,
      .collection__header,
      .gallery-oval { opacity: 1 !important; }
    </style>
  </noscript>
  <script>
    // Force ParticleText canvas full-screen + resize
    var done = false;
    var check = setInterval(function() {
      var c = document.querySelector('#hero3d canvas[aria-hidden]');
      if (c && !done) {
        done = true;
        c.style.position = 'fixed';
        c.style.top = '0'; c.style.left = '0';
        c.style.width = '100vw'; c.style.height = '100vh';
        // Directly call resize every 200ms until it works
        var tries = 0;
        var retry = setInterval(function() {
          if (typeof particleText !== 'undefined' && particleText.resize) {
            particleText.resize();
            clearInterval(retry);
          } else if (tries++ > 30) { clearInterval(retry); }
        }, 200);
        clearInterval(check);
      }
    }, 500);
  </script>
</head>
<body>

  <!-- grain texture overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- transition blackout overlay (fades in on section switch) -->
  <div class="transition-black" id="transitionBlack" aria-hidden="true"></div>

  <!-- ============================================================
       SECTION 1: 3D FLOATING HERO
       ============================================================ -->
  <section class="hero-3d" id="hero3d">
    <div class="hero-3d__bg" aria-hidden="true"></div>
    <canvas class="hero-3d__particles" id="heroParticles" aria-hidden="true"></canvas>

    <div class="hero-3d__stage" id="heroStage">
      <div class="hero-3d__product" id="heroProduct">
        <img class="hero-3d__img" src="images/product01.jpg" alt="ELVERE &amp; LUNE Signature Bracelet" draggable="false" />
      </div>
      <div class="hero-3d__reflection" aria-hidden="true"></div>
    </div>

    <div class="hero-3d__brand" id="heroBrand">
      <p class="hero-3d__label">NATURAL CRYSTALS</p>
      <h1 class="hero-3d__title">
        <span class="hero-3d__word">ELVERE</span>
        <span class="hero-3d__amp">&amp;</span>
        <span class="hero-3d__word">LUNE</span>
      </h1>
      <p class="hero-3d__subtitle">Objects shaped by nature.</p>
    </div>

    <div class="hero-3d__scroll" id="heroScroll">
      <span class="hero-3d__scroll-line"></span>
      <span class="hero-3d__scroll-text">CLICK TO VIEW</span>
    </div>
  </section>

  <!-- ============================================================
       SECTION 2: GUIDE — TRANSITION PAGE
       ============================================================ -->
  <section class="guide" id="guide">
    <div class="guide__bg" id="guideBg" aria-hidden="true"></div>
    <div class="guide__text" id="guideText"></div>
  </section>

  <!-- ============================================================
       SECTION 3: COLLECTION — ELLIPTICAL FLOATING SHOWCASE
       ============================================================ -->
  <section class="collection" id="collection">

    <div class="collection__header">
      <h2 class="collection__title">THE COLLECTION</h2>
      <p class="collection__subtitle">A constellation of natural stones.</p>
    </div>

    <div id="infiniteMenuWrapper" style="position:relative;width:100%;flex:1;min-height:0;"></div>

  </section>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="libs/gsap.min.js"></script>
  <script src="libs/ScrollTrigger.min.js"></script>
  <script src="libs/gl-matrix-min.js"></script>
  <script src="components/InfiniteMenu/InfiniteMenu.js"></script>
  <script src="components/ParticleBackground/ParticleBackground.js?v=2"></script>
  <script src="components/ParticleText/ParticleText.js?v=13"></script>
  <script src="components/TextType/TextType.js"></script>
  <script type="module" src="components/GhostCursor/GhostCursor.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
