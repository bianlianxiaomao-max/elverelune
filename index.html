<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELVERE &amp; LUNE — Natural Crystal Bracelets</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ 开场动画层 ============ -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro__brand">ELVERE &amp; LUNE</div>
    <div class="intro__product">
      <img src="images/product01.jpg" alt="Signature bracelet">
    </div>
  </div>

  <!-- ============ 商品区 ============ -->
  <main class="collection">
    <header class="collection__head">
      <h2 class="collection__title">THE COLLECTION</h2>
      <p class="collection__subtitle">Natural crystals, shaped by nature.</p>
    </header>

    <div class="grid">
      <figure class="card">
        <div class="card__media"><img src="images/product01.jpg" alt="Lune Pendant"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Lune Pendant</h3>
          <p class="card__mat">Silver moonstone</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product02.jpg" alt="Solar Band"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Solar Band</h3>
          <p class="card__mat">Golden sunstone</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product03.jpg" alt="Terra Bracelet"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Terra Bracelet</h3>
          <p class="card__mat">Earth-toned agate</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product04.jpg" alt="Nova Ring"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Nova Ring</h3>
          <p class="card__mat">Starlight quartz</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product05.jpg" alt="Ocean Drop"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Ocean Drop</h3>
          <p class="card__mat">Deep blue lapis</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product06.jpg" alt="Forest Talisman"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Forest Talisman</h3>
          <p class="card__mat">Green malachite</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product07.jpg" alt="Ember Earrings"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Ember Earrings</h3>
          <p class="card__mat">Fire opal glow</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product08.jpg" alt="Silk Strand"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Silk Strand</h3>
          <p class="card__mat">Pearl lustre</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product09.jpg" alt="Dusk Choker"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Dusk Choker</h3>
          <p class="card__mat">Twilight amethyst</p>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="card__media"><img src="images/product10.jpg" alt="Dawn Cuff"></div>
        <figcaption class="card__info">
          <h3 class="card__name">Dawn Cuff</h3>
          <p class="card__mat">Rose quartz glow</p>
        </figcaption>
      </figure>
    </div>
  </main>

  <footer class="footer">
    <span class="footer__brand">ELVERE &amp; LUNE</span>
    <span class="footer__note">Natural crystal bracelets</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
